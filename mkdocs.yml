site_name: LiDAR Camera Calibrator
site_description: Data-source-agnostic LiDAR-to-camera calibration for Python
site_url: https://gre3nlion.github.io/lidar-camera-calibrator/
repo_url: https://github.com/Gre3nLioN/lidar-camera-calibrator
repo_name: Gre3nLioN/lidar-camera-calibrator
copyright: Licensed under Apache-2.0

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Use light mode

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Integrating data: data-integration.md
  - Python API: api.md
  - Canonical MCAP:
      - Profile reference: scene-mcap-profile.md
      - Migration: migration.md
      - Schema compatibility: schema-v1-review.md
      - Performance: scene-profile-performance.md
  - Platform support: platform-support.md
  - Release process: release.md
  - Contributing: contributing.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - toc:
      permalink: true

strict: true
